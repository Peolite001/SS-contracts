[package]
name = "debtor-registry"
version = "0.1.0"
edition = "2021"
publish = false
description = "Admin-managed debtor status registry with listing eligibility checks"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
